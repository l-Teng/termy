name: Tmon vs Ghostty Memory Benchmark

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Fresh processes per engine/workload (2-50)"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  benchmark:
    name: Terminal-state physical memory comparison
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GHOSTTY_REVISION: 9e30f70f23418fecbdca1088673000417527c4e4
      REPORT_NAME: tmon-ghostty-memory-benchmark.txt
      TMON_GHOSTTY_MEMORY_SAMPLES: ${{ inputs.samples || '10' }}
    steps:
      - name: Initialize report
        id: initialize_report
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/$REPORT_NAME"

      - name: Checkout Termy
        id: checkout_termy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout pinned Ghostty
        id: checkout_ghostty
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ghostty-org/ghostty
          ref: ${{ env.GHOSTTY_REVISION }}
          path: .ghostty-benchmark
          persist-credentials: false

      - name: Setup Rust
        id: setup_rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1

      - name: Setup Zig
        id: setup_zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cache Rust
        id: cache_rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: tools/tmon-ghostty-memory -> target

      - name: Build libghostty-vt
        id: build_ghostty
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/ghostty-vt"
          cd .ghostty-benchmark
          zig build \
            -Dapp-runtime=none \
            -Demit-lib-vt=true \
            -Demit-xcframework=false \
            -Doptimize=ReleaseFast \
            -Dcpu=baseline \
            --prefix "$prefix"
          test -f "$prefix/include/ghostty/vt.h"
          test -f "$prefix/lib/libghostty-vt.a"

      - name: Run fresh-process comparison
        id: comparison
        shell: bash
        env:
          GHOSTTY_VT_PREFIX: ${{ runner.temp }}/ghostty-vt
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/$REPORT_NAME"
          {
            echo "Termy commit: $GITHUB_SHA"
            echo "Ghostty commit: $GHOSTTY_REVISION"
            echo "Runner: $RUNNER_OS/$RUNNER_ARCH"
            echo "Runner image: ${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo "Kernel: $(uname -srvm)"
            echo "CPU: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m)"
            rustc --version
            zig version
            echo
            cargo run --locked --quiet --release \
              --manifest-path tools/tmon-ghostty-memory/Cargo.toml
          } 2>&1 | tee -a "$report"

      - name: Finalize report
        id: finalize_report
        if: ${{ always() }}
        shell: bash
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize_report.outcome }}
          TERMY_CHECKOUT_OUTCOME: ${{ steps.checkout_termy.outcome }}
          GHOSTTY_CHECKOUT_OUTCOME: ${{ steps.checkout_ghostty.outcome }}
          RUST_OUTCOME: ${{ steps.setup_rust.outcome }}
          ZIG_OUTCOME: ${{ steps.setup_zig.outcome }}
          CACHE_OUTCOME: ${{ steps.cache_rust.outcome }}
          GHOSTTY_BUILD_OUTCOME: ${{ steps.build_ghostty.outcome }}
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/$REPORT_NAME"
          : >> "$report"
          {
            echo
            echo "Workflow step outcomes"
            echo "======================"
            printf 'Initialize report: %s\n' "${INITIALIZE_OUTCOME:-unknown}"
            printf 'Checkout Termy:    %s\n' "${TERMY_CHECKOUT_OUTCOME:-unknown}"
            printf 'Checkout Ghostty:  %s\n' "${GHOSTTY_CHECKOUT_OUTCOME:-unknown}"
            printf 'Setup Rust:        %s\n' "${RUST_OUTCOME:-unknown}"
            printf 'Setup Zig:         %s\n' "${ZIG_OUTCOME:-unknown}"
            printf 'Cache Rust:        %s\n' "${CACHE_OUTCOME:-unknown}"
            printf 'Build Ghostty:     %s\n' "${GHOSTTY_BUILD_OUTCOME:-unknown}"
            printf 'Run comparison:    %s\n' "${COMPARISON_OUTCOME:-unknown}"
          } >> "$report"

      - name: Add report to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/$REPORT_NAME"
          if [[ ! -f "$report" ]]; then
            echo "Benchmark report was not created." > "$report"
          fi
          {
            echo '## Tmon vs libghostty-vt physical memory'
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tmon-ghostty-memory-${{ github.sha }}
          path: ${{ runner.temp }}/tmon-ghostty-memory-benchmark.txt
          if-no-files-found: error
          retention-days: 30
