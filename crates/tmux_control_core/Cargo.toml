[package]
name = "termy_tmux_control_core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
flume = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2"
# Enables rustix's std fd types so the PTY's OwnedFd converts to std `File`.
rustix = { version = "1", features = ["std"] }
